name: Dhruv backend checks
on:
  pull_request:
  push:
    branches: ['dhruv/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: civicresolve_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/civicresolve_test
      DIRECT_URL: postgresql://postgres:ci-test-password@localhost:5432/civicresolve_test
      JWT_SECRET: ci-only-secret-do-not-use-in-production-12345
      SLA_CRON_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --workspace server run prisma:generate
      - run: npm --workspace server run prisma:deploy
      - run: npm --workspace server run data:import
      - run: npm test
      - run: RUN_INTEGRATION=true npm --workspace server run test:integration
      - run: npm run build
