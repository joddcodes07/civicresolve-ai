services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: civicresolve
      POSTGRES_USER: civicresolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or root .env}
    volumes:
      - civicresolve_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicresolve -d civicresolve"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    env_file: server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://civicresolve:${POSTGRES_PASSWORD}@db:5432/civicresolve
      DIRECT_URL: postgresql://civicresolve:${POSTGRES_PASSWORD}@db:5432/civicresolve
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - civicresolve_uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  civicresolve_pg:
  civicresolve_uploads:
